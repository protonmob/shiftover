<svg xmlns="http://www.w3.org/2000/svg" width="820" height="528" viewBox="0 0 820 528" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="820" height="528" rx="10" fill="#0f1117"/>
<rect width="820" height="32" rx="10" fill="#1b1e27"/><rect y="20" width="820" height="12" fill="#1b1e27"/>
<circle cx="18" cy="16" r="5.5" fill="#ff5f57"/><circle cx="36" cy="16" r="5.5" fill="#febc2e"/><circle cx="54" cy="16" r="5.5" fill="#28c840"/>
<text x="410.0" y="20" text-anchor="middle" fill="#8b8f9c" font-size="12">shiftover setup</text>
<text x="22" y="46" xml:space="preserve"><tspan fill="#8b8f9c">$ </tspan><tspan fill="#79c0ff">shiftover setup</tspan></text>
<text x="22" y="67" xml:space="preserve"></text>
<text x="22" y="88" xml:space="preserve"><tspan fill="#e6e6e6">I found 3 Claude Code accounts on this machine:</tspan></text>
<text x="22" y="109" xml:space="preserve"></text>
<text x="22" y="130" xml:space="preserve"><tspan fill="#e6e6e6">  1. alex        alex@example.com         (~/.claude)</tspan></text>
<text x="22" y="151" xml:space="preserve"><tspan fill="#e6e6e6">  2. alex-work   alex@work.example.com    (~/.claude-work)</tspan></text>
<text x="22" y="172" xml:space="preserve"><tspan fill="#e6e6e6">  3. spare       spare@example.com        (~/.claude-spare)</tspan></text>
<text x="22" y="193" xml:space="preserve"></text>
<text x="22" y="214" xml:space="preserve"><tspan fill="#e6e6e6">Which one is your main account?</tspan></text>
<text x="22" y="235" xml:space="preserve"><tspan fill="#8b8f9c">`claude` will always open it; the others step in when it runs out of usage.</tspan></text>
<text x="22" y="256" xml:space="preserve"><tspan fill="#e6e6e6">Main account [1]: </tspan><tspan fill="#f2cc60">1</tspan></text>
<text x="22" y="277" xml:space="preserve"></text>
<text x="22" y="298" xml:space="preserve"><tspan fill="#7ee787">Done. What changed:</tspan></text>
<text x="22" y="319" xml:space="preserve"><tspan fill="#7ee787">  • </tspan><tspan fill="#e6e6e6">`claude` opens alex. `cl` lets you pick an account by hand.</tspan></text>
<text x="22" y="340" xml:space="preserve"><tspan fill="#7ee787">  • </tspan><tspan fill="#e6e6e6">When alex runs out, your conversation continues on another account by itself.</tspan></text>
<text x="22" y="361" xml:space="preserve"><tspan fill="#7ee787">  • </tspan><tspan fill="#e6e6e6">Inside Claude: type /handoff to switch, or ask Claude to &quot;delegate&quot; a task</tspan></text>
<text x="22" y="382" xml:space="preserve"><tspan fill="#e6e6e6">    to another account.</tspan></text>
<text x="22" y="403" xml:space="preserve"><tspan fill="#7ee787">  • </tspan><tspan fill="#e6e6e6">The status line shows how much of each account is used.</tspan></text>
<text x="22" y="424" xml:space="preserve"><tspan fill="#7ee787">  • </tspan><tspan fill="#e6e6e6">Your Claude settings were backed up first (~/.claude/settings.json.bak-…).</tspan></text>
<text x="22" y="445" xml:space="preserve"></text>
<text x="22" y="466" xml:space="preserve"><tspan fill="#e6e6e6">Open a new terminal tab to start.</tspan></text>
<text x="22" y="487" xml:space="preserve"><tspan fill="#8b8f9c">`shiftover status` shows all accounts.  `shiftover uninstall` undoes everything.</tspan></text>
</svg>