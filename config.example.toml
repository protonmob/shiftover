# ~/.config/shiftover/config.toml
# Written by `shiftover setup`; edit freely.

main = "main"          # the account `claude` opens by default
threshold = 95         # % of a 5-hour or weekly window that triggers a hand-off
lang = "en"            # en | tr
# ignore = ["~/.claude-old"]   # directories `setup` must not pick up (filled by `shiftover remove`)

[accounts.main]
dir = "~/.claude"
email = "you@example.com"

[accounts.second]
dir = "~/.claude-second"
email = "you+2@example.com"
# models = ["opus", "sonnet"]   # optional: skip this account when another model is requested

[accounts.third]
dir = "~/.claude-third"
email = "you+3@example.com"

[accounts.work]
dir = "~/.claude-work"
email = "you@work.example"
pool = false           # kept separate: opened only with `claude -a work` or a [map] rule, never a hand-off/delegate target

[handoff]
mode = "auto"          # auto: switch at the end of the turn | ask: offer after /exit | off

[delegate]
wait_seconds = 90          # foreground wait before a delegate job goes to the background
permission_mode = "default"
mcp = "none"               # none | main: pass the main account's local MCP servers to delegate jobs
allow_bypass = false

[tips]
enabled = true
min_interval_min = 10
levels = [75, 90]

[statusline]
wrap = ""              # your existing status line command, run first; shiftover appends account + limits

[codex]
enabled = true         # offer the OpenAI Codex CLI as delegate target "codex" when it is installed
bin = "codex"

[map]
# "~/work/acme" = "work"
